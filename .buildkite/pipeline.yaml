steps:
  - label: "Build Linux amd64 wheel"
    key: build-linux-amd64-wheel
    agents:
      os: linux
      arch: amd64
    command: |
      if [[ -n "$$BUILDKITE_TAG" ]]; then
        export SETUPTOOLS_SCM_PRETEND_VERSION="$${BUILDKITE_TAG#v}"
      else
        LATEST_TAG=$$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')
        LATEST_TAG="$${LATEST_TAG:-0.0.0}"

        if [[ "$$BUILDKITE_BRANCH" == "main" ]]; then
          export SETUPTOOLS_SCM_PRETEND_VERSION="$${LATEST_TAG}.dev$${BUILDKITE_BUILD_NUMBER}"
        else
          export SETUPTOOLS_SCM_PRETEND_VERSION="$${LATEST_TAG}+g$${BUILDKITE_COMMIT:0:7}"
        fi
      fi
      export CONAN_ARGS="--pathToExternalModules=./af-basilisk-ext/af_basilisk_ext"
      uvx --python 3.11 --with wheel,conan==2.15.1 pip wheel --no-deps -w dist/ .
    plugins:
      - docker#v5.11.0:
          # Custom image with "ccache" installed alongside uv
          image: "astral/uv:python3.11-trixie"
          workdir: /workspace
          platform: linux/amd64
          shell: ["/bin/bash", "-e", "-c"]
          volumes:
            - ".:/workspace"
          environment:
            - BUILDKITE_TAG
            - BUILDKITE_BUILD_NUMBER
            - BUILDKITE_COMMIT
      - cache#v1.8.1:
          path: build
          restore: pipeline
          save: branch
    artifact_paths:
      - "dist/*.whl"

  - label: "Build Linux aarch64 wheel"
    key: build-linux-aarch64-wheel
    agents:
      os: linux
      arch: aarch64
    command: |
      if [[ -n "$$BUILDKITE_TAG" ]]; then
        export SETUPTOOLS_SCM_PRETEND_VERSION="$${BUILDKITE_TAG#v}"
      else
        LATEST_TAG=$$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')
        LATEST_TAG="$${LATEST_TAG:-0.0.0}"

        if [[ "$$BUILDKITE_BRANCH" == "main" ]]; then
          export SETUPTOOLS_SCM_PRETEND_VERSION="$${LATEST_TAG}.dev$${BUILDKITE_BUILD_NUMBER}"
        else
          export SETUPTOOLS_SCM_PRETEND_VERSION="$${LATEST_TAG}+g$${BUILDKITE_COMMIT:0:7}"
        fi
      fi
      export CONAN_ARGS="--pathToExternalModules=./af-basilisk-ext/af_basilisk_ext"
      uvx --python 3.11 --with wheel,conan==2.15.1 pip wheel --no-deps -w dist/ .
    plugins:
      - docker#v5.11.0:
          image: "astral/uv:python3.11-trixie"
          workdir: /workspace
          platform: linux/aarch64
          shell: ["/bin/bash", "-e", "-c"]
          volumes:
            - ".:/workspace"
          environment:
            - BUILDKITE_TAG
            - BUILDKITE_BUILD_NUMBER
            - BUILDKITE_COMMIT
      - cache#v1.8.1:
          path: build
          restore: pipeline
          save: branch
    artifact_paths:
      - "dist/*.whl"

  - label: "🍎 macOS wheels"
    key: build-macos-wheel
    command: |
      if [[ -n "$$BUILDKITE_TAG" ]]; then
        export SETUPTOOLS_SCM_PRETEND_VERSION="$${BUILDKITE_TAG#v}"
      else
        LATEST_TAG=$$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')
        LATEST_TAG="$${LATEST_TAG:-0.0.0}"

        if [[ "$$BUILDKITE_BRANCH" == "main" ]]; then
          export SETUPTOOLS_SCM_PRETEND_VERSION="$${LATEST_TAG}.dev$${BUILDKITE_BUILD_NUMBER}"
        else
          export SETUPTOOLS_SCM_PRETEND_VERSION="$${LATEST_TAG}+g$${BUILDKITE_COMMIT:0:7}"
        fi
      fi
  
      command -v uv >/dev/null 2>&1 || brew install uv
      export CONAN_ARGS="--pathToExternalModules=./af-basilisk-ext/af_basilisk_ext"
      export CC="ccache gcc"
      export CXX="ccache g++"
      
      uvx --python 3.11 --with wheel,conan==2.15.1 pip wheel --no-deps -w dist/ .
      # Build the python-only extensions just once
      uvx --python 3.11 --with wheel pip wheel --no-deps -w dist/ ./af-basilisk-ext
    plugins:
      - cache#v1.8.1:
          path: /Users/operator/.ccache
          restore: pipeline
          save: branch

    agents:
      os: macos
    artifact_paths:
     - "dist/*.whl"

  - label: "Upload to PyPI"
    secrets:
      - R2_ACCESS_KEY
      - R2_SECRET_KEY
    agents:
      os: macos
    command: |
      buildkite-agent artifact download "dist/*.whl" .
      command -v uv >/dev/null 2>&1 || brew install uv
      export AWS_ACCESS_KEY_ID=$$(buildkite-agent secret get R2_ACCESS_KEY)
      export AWS_SECRET_ACCESS_KEY=$$(buildkite-agent secret get R2_SECRET_KEY)

      export ENDPOINT=$$(buildkite-agent secret get R2_ENDPOINT)
      uvx --from awscli aws s3 cp s3://pyutils/packages.json packages-old.json \
        --endpoint-url $${ENDPOINT}
      
      for f in dist/*.whl; do
        echo "{\"filename\": \"$(basename $$f)\", \"requires_python\": \">=3.8, <3.14\"}"
      done > packages-new.json

      # Merge old + new
      cat packages-old.json packages-new.json | sort -u > packages-all.json

      uvx dumb-pypi --package-list-json packages-all.json \
        --packages-url https://pypi.astroforge.dev/wheels/ \
        --title "AstroForge Python Repository" \
        --logo "/logo.svg" \
        --logo-width 30 \
        --output-dir repo/

      cat repo/packages.json

      uvx --from awscli aws s3 sync dist/ \
        s3://pyutils/wheels/ \
        --endpoint-url $${ENDPOINT}
      uvx --from awscli aws s3 sync repo/ \
        s3://pyutils/ \
        --endpoint-url $${ENDPOINT}

    depends_on:
      - build-macos-wheel
      - build-linux-amd64-wheel
      - build-linux-aarch64-wheel
