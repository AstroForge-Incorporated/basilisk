steps:
  - label: "Compute version and generate pipeline"
    key: compute-version
    agents:
      os: linux
      arch: amd64
    command: |
      if [[ -n "$$BUILDKITE_TAG" ]]; then
        VERSION="$${BUILDKITE_TAG}"
      else
        LATEST_TAG=$$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')
        LATEST_TAG="$${LATEST_TAG:-0.0.0}"

        if [[ "$$BUILDKITE_BRANCH" == "develop_updated" ]]; then
          VERSION="$${LATEST_TAG}.dev$${BUILDKITE_BUILD_NUMBER}"
        else
          VERSION="$${LATEST_TAG}+g$${BUILDKITE_COMMIT:0:7}"
        fi
      fi

      echo "Version: $${VERSION}"
      sed "s/__WHEEL_VERSION__/$${VERSION}/g" .buildkite/build-steps.yaml \
        | buildkite-agent pipeline upload
